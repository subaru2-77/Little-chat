<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatty</title>
  <style>
    :root {
      --accent: #6366f1;
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-solid: #141b2e;
      --border: rgba(255, 255, 255, 0.10);
      --text: #e6e9f5;
      --muted: #8b93a7;
      --bubble-other: #1f2740;
      --fs: 15px;
    }
    body.light {
      --bg: #eef1f8;
      --panel: rgba(255, 255, 255, 0.75);
      --panel-solid: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text: #1a1f36;
      --muted: #6b7280;
      --bubble-other: #e7eaf3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent) 35%, transparent), transparent),
        radial-gradient(900px 500px at 110% 110%, color-mix(in srgb, var(--accent) 25%, transparent), transparent),
        var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: .8em; }
    .center { text-align: center; }
    .logo { font-size: 1.4rem; }
    .logo.big { font-size: 3rem; }
    .full { width: 100%; }
    .error { color: #f87171; min-height: 1.2em; font-size: .9em; }
    .stack { display: flex; flex-direction: column; gap: 12px; }

    /* Cards and buttons */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    .card h1 { font-size: 1.6rem; margin: 8px 0 4px; }
    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: transform .1s, opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .btn:active { transform: scale(.98); }
    .btn.small { padding: 10px 14px; }
    .primary { background: linear-gradient(135deg, var(--accent), #a855f7); color: #fff; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .danger { background: #ef4444; color: #fff; }
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0; color: var(--muted); font-size: .85em;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* Form fields */
    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    input[type=color] { height: 44px; padding: 4px; }

    /* Chat layout */
    .app {
      width: 100%;
      max-width: 820px;
      height: min(92vh, 780px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; gap: 10px; align-items: center; }
    .brand b { font-size: 1.05rem; }
    .brand small { display: block; color: var(--muted); }
    .icon-btn {
      background: transparent; border: 0; font-size: 1.2rem; cursor: pointer;
      width: 40px; height: 40px; border-radius: 12px; color: var(--text);
    }
    .icon-btn:hover { background: color-mix(in srgb, var(--text) 10%, transparent); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty { margin: auto; color: var(--muted); }
    .row-msg { display: flex; gap: 10px; align-items: flex-end; max-width: 80%; }
    .row-msg.mine { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; flex-shrink: 0;
    }
    .body { display: flex; flex-direction: column; min-width: 0; }
    .mine .body { align-items: flex-end; }
    .meta { font-size: .78em; color: var(--muted); margin: 0 6px 4px; }
    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      background: var(--bubble-other);
      word-wrap: break-word;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .theirs .bubble { border-bottom-left-radius: 6px; }
    .mine .bubble {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .time { font-size: .7em; color: var(--muted); margin: 4px 6px 0; }

    .composer {
      position: relative;
      display: flex; gap: 8px; align-items: center;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .composer input { flex: 1; border-radius: 999px; }
    .send {
      width: 44px; height: 44px; border-radius: 50%; border: 0;
      background: var(--accent); color: #fff; font-size: 1.1rem; cursor: pointer;
    }
    .emoji-picker {
      position: absolute;
      bottom: 64px; left: 12px;
      width: 300px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 10px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
      z-index: 5;
    }
    .emo {
      background: none; border: 0; font-size: 1.3rem; cursor: pointer;
      border-radius: 8px; padding: 4px;
    }
    .emo:hover { background: color-mix(in srgb, var(--text) 10%, transparent); }

    /* Settings modal */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, .5);
      display: grid; place-items: center;
      padding: 16px; z-index: 10;
    }
    .modal-card {
      width: 100%; max-width: 420px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      max-height: 90vh;
      overflow: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { font-size: 1.3rem; }
    .field { margin-bottom: 16px; }
    .field > label { display: block; font-size: .85em; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .check label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .check input { width: auto; }
    .actions { display: flex; gap: 10px; margin-top: 8px; }
    .actions .btn { flex: 1; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { height: 100vh; height: 100dvh; max-width: none; border-radius: 0; }
      .card { padding: 22px; }
      .row-msg { max-width: 92%; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <section id="login" class="card hidden">
    <div class="center">
      <div class="logo big">💬</div>
      <h1>Welcome to Chatty</h1>
      <p class="muted">Sign in or continue as a guest</p>
    </div>
    <br />
    <form id="loginForm" class="stack">
      <input id="lUser" placeholder="Username (2–20 characters)" maxlength="20" autocomplete="username" required />
      <input id="lPass" type="password" placeholder="Password (min. 4 characters)" autocomplete="current-password" />
      <p id="lErr" class="error"></p>
      <button class="btn primary full" type="submit">Sign in</button>
    </form>
    <div class="divider"><span>or</span></div>
    <button id="guestBtn" class="btn ghost full" type="button">Continue as guest 👋</button>
    <p class="muted small" style="margin-top:14px;text-align:center">New username? An account is created automatically.</p>
  </section>

  <!-- CHAT SCREEN -->
  <main id="chat" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="logo">💬</span>
        <div>
          <b>Chatty</b>
          <small id="whoami">Not signed in</small>
        </div>
      </div>
      <button id="openSettings" class="icon-btn" title="Settings">⚙️</button>
    </header>

    <div id="messages" class="messages"></div>

    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="emojiBtn" class="icon-btn" title="Emoji">😊</button>
      <div id="emojiPicker" class="emoji-picker hidden"></div>
      <input id="input" placeholder="Type a message…" maxlength="500" />
      <button class="send" type="submit" title="Send">➤</button>
    </form>
  </main>

  <!-- SETTINGS MODAL -->
  <div id="settings" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-btn" title="Close">✕</button>
      </div>

      <div class="field">
        <label for="setName">Display name</label>
        <div class="row">
          <input id="setName" maxlength="20" />
          <button id="saveName" class="btn primary small" type="button">Save</button>
        </div>
      </div>

      <div class="field">
        <label for="setTheme">Theme</label>
        <select id="setTheme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <div class="field">
        <label for="setAccent">Accent colour</label>
        <input type="color" id="setAccent" />
      </div>

      <div class="field">
        <label for="setFs">Font size: <span id="fsVal"></span>px</label>
        <input type="range" id="setFs" min="12" max="20" step="1" />
      </div>

      <div class="field check">
        <label><input type="checkbox" id="setSound" /> Sound on new messages</label>
      </div>
      <div class="field check">
        <label><input type="checkbox" id="setTime" /> Show timestamps</label>
      </div>

      <div class="actions">
        <button id="clearChat" class="btn ghost" type="button">Clear chat</button>
        <button id="signOut" class="btn danger" type="button">Sign out</button>
      </div>
    </div>
  </div>

<script>
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  };

  const K = {
    users: 'chatty_users',
    session: 'chatty_session',
    msgs: 'chatty_messages',
    settings: 'chatty_settings'
  };

  const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😢','😡','👍','👎','👏','🙏',
                  '🎉','🔥','❤️','💯','✨','😴','🤗','😅','🙌','👋','😜','🤩',
                  '🥳','😇','🤝','💪','🍕','☕','🌟','🚀','🐱','🐶','🌈','⚽',
                  '🎮','🎵','📷','💡','✅','❌','😺','🌙','🍀','🎈','💬','👀'];

  const read = (k, fallback) => {
    try { return JSON.parse(localStorage.getItem(k)) ?? fallback; }
    catch { return fallback; }
  };
  const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  let settings = {
    theme: 'dark',
    accent: '#6366f1',
    fontSize: 15,
    sound: true,
    timestamps: true,
    ...read(K.settings, {})
  };
  let session = read(K.session, null);
  let messages = read(K.msgs, []);

  const NAME_RE = /^[\p{L}\p{N} _.-]{2,20}$/u;
  // Simple encoding for the demo only. Not real security.
  const encode = (s) => btoa(unescape(encodeURIComponent(s)));

  /* ---------- Settings ---------- */
  function applySettings() {
    document.body.classList.toggle('light', settings.theme === 'light');
    document.documentElement.style.setProperty('--accent', settings.accent);
    document.documentElement.style.setProperty('--fs', settings.fontSize + 'px');
  }
  function saveSettings() {
    write(K.settings, settings);
    applySettings();
  }

  /* ---------- Login / session ---------- */
  function showError(msg) { $('#lErr').textContent = msg; }

  $('#loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#lUser').value.trim();
    const pass = $('#lPass').value;

    if (!NAME_RE.test(name)) {
      return showError('Username must be 2–20 characters (letters, numbers, space, _ . -).');
    }
    if (pass.length < 4) {
      return showError('Password must be at least 4 characters.');
    }

    const users = read(K.users, {});
    const key = name.toLowerCase();

    if (users[key]) {
      if (users[key].pass !== encode(pass)) return showError('Wrong password for this username.');
    } else {
      users[key] = { name, pass: encode(pass) };
      write(K.users, users);
    }
    startSession({ name: users[key].name, guest: false });
  });

  $('#guestBtn').addEventListener('click', () => {
    startSession({ name: 'Guest' + Math.floor(1000 + Math.random() * 9000), guest: true });
  });

  function startSession(s) {
    session = s;
    write(K.session, s);
    showChat();
  }

  function showChat() {
    $('#login').classList.add('hidden');
    $('#chat').classList.remove('hidden');
    $('#whoami').textContent = session.guest ? `Guest · ${session.name}` : `Signed in as ${session.name}`;
    renderMessages();
    const box = $('#messages');
    box.scrollTop = box.scrollHeight;
    $('#input').focus();
  }

  function showLogin() {
    $('#chat').classList.add('hidden');
    $('#login').classList.remove('hidden');
    $('#lErr').textContent = '';
  }

  /* ---------- Messages ---------- */
  function colorFor(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `hsl(${h} 70% 50%)`;
  }

  function sendMessage(text) {
    text = text.tr
